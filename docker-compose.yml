# NLP2CMD Text4 - Complete Docker Setup
# 
# This docker-compose file runs both services:
# - ./1/ - NLP2CMD API (text4 backend service)
# - ./2/ - Web Frontend (HTML generator UI)
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f        # View logs
#   docker-compose down           # Stop all services
#
# Configuration: Edit .env file to change ports and settings

services:
  # ============================================================================
  # NLP2CMD API Service (./1/)
  # Backend API for text-to-HTML conversion
  # ============================================================================
  nlp2cmd-api:
    build:
      context: .
      dockerfile: 1/Dockerfile.full
    container_name: ${API_CONTAINER_NAME:-nlp2cmd-text4-api}
    ports:
      - "${API_EXTERNAL_PORT:-8001}:${API_PORT:-8000}"
    environment:
      - HOST=${API_HOST:-0.0.0.0}
      - PORT=${API_PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - DEBUG=${DEBUG:-false}
    env_file:
      - .env
      - ./1/.env
    volumes:
      - ./1/output:/app/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - nlp2cmd-network

  # ============================================================================
  # Web Frontend Service (./2/)
  # Interactive HTML generator UI
  # ============================================================================
  web-frontend:
    build:
      context: ./2
      dockerfile: Dockerfile
    container_name: ${WEB_CONTAINER_NAME:-nlp2cmd-web-frontend}
    ports:
      - "${WEB_EXTERNAL_PORT:-8081}:${WEB_PORT:-80}"
    environment:
      - API_HOST=nlp2cmd-api
      - API_PORT=${API_PORT:-8000}
    env_file:
      - .env
      - ./2/.env
    depends_on:
      nlp2cmd-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - nlp2cmd-network

networks:
  nlp2cmd-network:
    driver: bridge
    name: ${NETWORK_NAME:-nlp2cmd-network}
